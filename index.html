<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人主页</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: 360px;
      padding: 40px;
      text-align: center;
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    .avatar {
      width: 96px;
      height: 96px;
      margin: 0 auto 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      background: #667eea;
      color: white;
      font-size: 40px;
    }

    h1 {
      margin-bottom: 10px;
      color: #222;
    }

    p {
      color: #666;
      line-height: 1.8;
    }

    button {
      margin-top: 16px;
      padding: 12px 24px;
      border: none;
      border-radius: 999px;
      background: #667eea;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #5368d8;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="avatar">👋</div>
    <h1>你好，我是 Admini</h1>
    <p>我正在学习 Vibe Coding，尝试用 AI 创建自己的网页。</p>
    <button id="contactButton">联系我</button>
    <p id="message"></p>
  </main>

  <script>
  const contactButton = document.getElementById("contactButton");
  const message = document.getElementById("message");

  contactButton.addEventListener("click", function () {
    message.textContent = "谢谢你的关注！欢迎和我联系。";
  });
</script>
</body>
</html>
